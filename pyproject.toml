[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agent"
version = "1.0.0"
description = "Autonomous Security & Code Health Agent"
requires-python = ">=3.10"
dependencies = [
    "tree-sitter",
    "tree-sitter-python",
    "google-genai",
    "fastapi",
    "uvicorn",
    "pydantic",
    "PyGithub",
    "python-dotenv"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "semgrep",
    "bandit"
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["BLE001", "PLW1510"]

[tool.mypy]
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
  "."
]
